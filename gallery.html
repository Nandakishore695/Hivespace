<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Photos - Hivespace</title>
</head>

<body>
    <header><div id="header"></div></header>

    <div class="position-relative">
        <a href="https://wa.me/+918978970007?abid=username&text=Hey%20there!."
            class="bg-secondary-subtle px-1 text-decoration-none text-black rounded position-fixed bottom-0 start-0 m-3"><img
                src="./images/icons/icons8-whatsapp-48.png" />WhatsApp us</a>
    </div>
    <div class="position-relative">
        <a href="header"
            class="bg-secondary p-2 text-decoration-none text-black rounded position-fixed bottom-0 end-0 m-3 btn btn-outline-secondary"><img
                src="./images/icons/icons8-up-arrow-28.png" /></a>
    </div>

    <section class="container-fluid">
        <div class="d-xl-flex my-2">
            <img src="./images/web-img/main-img.png" class="shadow rounded mx-1 mb-1 img-fluid" width="620" loading="lazy"/>
            <img src="./images/web-img/private-office-1.png" class="shadow rounded mx-1 mb-1 img-fluid" width="620" loading="lazy"/>
            <img src="./images/web-img/coworking-room.png" class="shadow rounded mx-1 mb-1 img-fluid" width="620" loading="lazy"/>

        <div class="d-xl-flex my-2">
            <img src="./images/web-img/Co-working-Space.png" class="shadow rounded mx-1 img-fluid " width="620" loading="lazy"/>
            <img src="./images/web-img/Manager-Cabins.png" class="shadow rounded mx-1 img-fluid" width="620" loading="lazy"/>
            <img src="./images/web-img/Manager-Cabin.png" class="shadow rounded mx-1 img-fluid" width="620" loading="lazy"/>
        </div>
        <div class="d-xl-flex my-2">
            <img src="./images/web-img/Wall-Art-Hive-Space.png" class="shadow rounded mx-1 img-fluid" width="620" loading="lazy"/>

            <img src="./images/web-img/cafeteria.png" class="shadow rounded mx-1 img-fluid" width="620" loading="lazy"/>

            <img src="./images/web-img/IMG_0509-scaled.jpg" class="shadow rounded mx-1 img-fluid" width="620" loading="lazy"/>
        </div>
    </section>

    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('header.html')
            .then(res => res.text())
            .then(data => document.getElementById('header').innerHTML = data);
    </script>
     <script>
        fetch('footer.html')
            .then(res => res.text())
            .then(data => document.getElementById('footer').innerHTML = data);
    </script>
